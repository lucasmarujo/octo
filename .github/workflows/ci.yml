name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Test the Windows installer
        if: matrix.os == 'windows-latest'
        run: cargo test --test installer_e2e -- --ignored

  build:
    name: build ${{ matrix.target }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            rustflags: -C target-feature=+crt-static
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            ext: ""
            rustflags: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            rustflags: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
            rustflags: ""
    runs-on: ${{ matrix.os }}
    env:
      ORKAI_BUILD_COMMIT: ${{ github.sha }}
      RUSTFLAGS: ${{ matrix.rustflags }}
      SIGN: ${{ matrix.os == 'windows-latest' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
      SIGNPATH_PROJECT_SLUG: orkai-cli
      SIGNPATH_POLICY_SLUG: release-signing
      SIGNPATH_TIMEOUT_SECONDS: 3600
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Read the version
        id: version
        if: env.SIGN == 'true'
        shell: bash
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Upload the binary for signing
        id: unsigned-binary
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signing-orkai-exe
          path: target/${{ matrix.target }}/release/orkai.exe
          if-no-files-found: error
      - name: Sign the binary
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: orkai-exe
          github-artifact-id: ${{ steps.unsigned-binary.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: ${{ env.SIGNPATH_TIMEOUT_SECONDS }}
          output-artifact-directory: target/signed/binary
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}
      - name: Use the signed binary
        if: env.SIGN == 'true'
        shell: bash
        run: mv -f target/signed/binary/orkai.exe "target/${{ matrix.target }}/release/orkai.exe"
      - name: Build the installer
        if: matrix.os == 'windows-latest'
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DBinary=$PWD\target\${{ matrix.target }}\release\orkai.exe" installer\orkai.iss
      - name: Upload the installer for signing
        id: unsigned-installer
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signing-orkai-setup
          path: target/installer/orkai-setup.exe
          if-no-files-found: error
      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: orkai-setup
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: ${{ env.SIGNPATH_TIMEOUT_SECONDS }}
          output-artifact-directory: target/signed/installer
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}
      - name: Use the signed installer
        if: env.SIGN == 'true'
        shell: bash
        run: mv -f target/signed/installer/orkai-setup.exe target/installer/orkai-setup.exe
      - name: Check the signatures
        if: env.SIGN == 'true'
        run: |
          foreach ($file in "target\${{ matrix.target }}\release\orkai.exe", "target\installer\orkai-setup.exe") {
            $signature = Get-AuthenticodeSignature $file
            if ($signature.Status -ne 'Valid') { throw "$file is not signed: $($signature.Status) $($signature.StatusMessage)" }
            "$file is signed by $($signature.SignerCertificate.Subject)"
          }
      - name: Warn that the Windows build is unsigned
        if: matrix.os == 'windows-latest' && env.SIGN != 'true'
        run: echo "::warning::SIGNPATH_ORGANIZATION_ID is not set, so orkai.exe and orkai-setup.exe are published unsigned"
      - name: Stage
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/orkai${{ matrix.ext }}" "dist/orkai-${{ matrix.target }}"
          if [ "${{ matrix.os }}" = windows-latest ]; then cp target/installer/orkai-setup.exe dist/; fi
      - uses: actions/upload-artifact@v4
        with:
          name: orkai-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish latest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that this commit is still the head of main
        id: head
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "main moved to $head; a newer run will publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.head.outputs.publish == 'true'
        with:
          path: dist
          pattern: orkai-*
          merge-multiple: true
      - name: Write manifest
        if: steps.head.outputs.publish == 'true'
        run: |
          export ORKAI_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          python3 - <<'EOF'
          import datetime, hashlib, json, os, pathlib
          dist = pathlib.Path("dist")
          installer = "orkai-setup.exe"
          assets = {}
          for path in sorted(dist.iterdir()):
              if not path.name.startswith("orkai-") or path.name == installer:
                  continue
              target = path.name[len("orkai-"):]
              data = path.read_bytes()
              assets[target] = {"name": path.name, "sha256": hashlib.sha256(data).hexdigest(), "size": len(data)}
          manifest = {
              "commit": os.environ["GITHUB_SHA"],
              "version": os.environ["ORKAI_VERSION"],
              "built_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "assets": assets,
          }
          (dist / "manifest.json").write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          EOF
      - name: Publish release
        if: steps.head.outputs.publish == 'true'
        run: |
          subject=$(git log -1 --format=%s "$GITHUB_SHA")
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "orkai latest (${GITHUB_SHA::7})" \
            --notes "Continuous build of main at $GITHUB_SHA: $subject

          On Windows, run orkai-setup.exe. Code signing policy: https://github.com/lucasmarujo/orkai-cli#code-signing-policy" \
            --latest

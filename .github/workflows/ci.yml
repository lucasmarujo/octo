name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Test the Windows installer
        if: matrix.os == 'windows-latest'
        run: cargo test --test installer_e2e -- --ignored

  desktop:
    name: desktop ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop
      - name: Install the webview libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Format
        run: cargo fmt -p orkai-desktop --check
      - name: Lint
        run: cargo clippy -p orkai-desktop --all-targets -- -D warnings
      - name: Test
        run: cargo test -p orkai-desktop
      - name: Test the interface
        run: node --test desktop/ui/tests/ui.test.mjs
      - name: Test the Windows installer
        if: matrix.os == 'windows-latest'
        run: cargo test -p orkai-desktop --test installer_e2e -- --ignored

  version:
    name: check the version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this version is already released
        id: release
        run: |
          tag="v$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag is already released; raise the version in Cargo.toml to publish a new one"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  desktop-build:
    name: build Octo for ${{ matrix.target }}
    if: ${{ !cancelled() && needs.desktop.result == 'success' && (needs.version.outputs.publish == 'true' || github.event_name == 'workflow_dispatch') }}
    needs: [desktop, version]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            download: Octo.exe
            update: Octo.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
            download: Octo-linux-x86_64
            update: Octo-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            download: Octo-macos-apple-silicon.zip
            update: Octo-macos-apple-silicon-update
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
            download: Octo-macos-intel.zip
            update: Octo-macos-intel-update
    runs-on: ${{ matrix.os }}
    env:
      ORKAI_BUILD_COMMIT: ${{ github.sha }}
      TARGET: ${{ matrix.target }}
      DOWNLOAD: ${{ matrix.download }}
      UPDATE: ${{ matrix.update }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}
      - name: Install the webview libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - name: Build
        run: cargo build --release --locked -p orkai-desktop --target ${{ matrix.target }}
      - name: Build the installer
        if: runner.os == 'Windows'
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DBinary=$PWD\target\${{ matrix.target }}\release\octo.exe" installer\octo.iss
      - name: Stage
        shell: bash
        run: |
          mkdir -p dist
          cp "target/$TARGET/release/octo${{ matrix.ext }}" "dist/$UPDATE"
          if [ "$RUNNER_OS" = Windows ]; then cp target/installer/Octo-setup.exe dist/; fi
      - name: Bundle the macOS app
        if: runner.os == 'macOS'
        run: |
          version=$(grep -m1 '^version' desktop/Cargo.toml | cut -d'"' -f2)
          app="target/bundle/Octo.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/$TARGET/release/octo" "$app/Contents/MacOS/octo"
          cp desktop/icons/icon.icns "$app/Contents/Resources/icon.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Octo</string>
            <key>CFBundleDisplayName</key><string>Octo</string>
            <key>CFBundleIdentifier</key><string>dev.marujo.octo</string>
            <key>CFBundleExecutable</key><string>octo</string>
            <key>CFBundleIconFile</key><string>icon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --sign - "$app"
          codesign --verify --strict --verbose=2 "$app"
          ditto -c -k --keepParent "$app" "dist/$DOWNLOAD"
      - name: Warn that the app is unsigned
        if: runner.os == 'Windows'
        run: echo "::warning::Octo is published unsigned"
      - uses: actions/upload-artifact@v4
        with:
          name: octo-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish ${{ needs.version.outputs.tag }}
    needs: [test, version, desktop-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-version
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Check that this commit is still the head of main
        id: head
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "main moved to $head; a newer run will publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.head.outputs.publish == 'true'
        with:
          path: dist
          pattern: octo-*
          merge-multiple: true
      - name: Write manifest
        if: steps.head.outputs.publish == 'true'
        run: |
          export ORKAI_VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          python3 - <<'EOF'
          import datetime, hashlib, json, os, pathlib
          dist = pathlib.Path("dist")
          updates = {
              "desktop-x86_64-pc-windows-msvc": "Octo.exe",
              "desktop-x86_64-unknown-linux-gnu": "Octo-linux-x86_64",
              "desktop-aarch64-apple-darwin": "Octo-macos-apple-silicon-update",
              "desktop-x86_64-apple-darwin": "Octo-macos-intel-update",
          }
          assets = {}
          for key, name in updates.items():
              data = (dist / name).read_bytes()
              assets[key] = {"name": name, "sha256": hashlib.sha256(data).hexdigest(), "size": len(data)}
          manifest = {
              "commit": os.environ["GITHUB_SHA"],
              "version": os.environ["ORKAI_VERSION"],
              "built_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "assets": assets,
          }
          (dist / "manifest.json").write_text(json.dumps(manifest, indent=2))
          print(json.dumps(manifest, indent=2))
          EOF
      - name: Publish the version
        if: steps.head.outputs.publish == 'true'
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$TAG is already released; its files never change"
            exit 0
          fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Octo $TAG" \
            --notes "Octo $TAG, by OctoAI, built from $GITHUB_SHA. Its files never change, so the releases/latest/download links always get the same files, and older versions update themselves to it.

          Download Octo: Octo-setup.exe on Windows (Octo.exe runs without installing), Octo-macos-apple-silicon.zip or Octo-macos-intel.zip on macOS (the first time, right-click Octo.app and choose Open, since it is not notarized) and Octo-linux-x86_64 on Linux, which needs WebKitGTK 4.1. Octo updates itself to every new version, and closing it never stops an agent; the Octo-macos-*-update files are what it downloads to do so on a Mac. Code signing policy: https://github.com/lucasmarujo/octo#code-signing-policy" \
            --latest

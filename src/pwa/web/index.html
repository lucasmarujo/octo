<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#121218" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Octo" />
    <meta name="referrer" content="no-referrer" />
    <title>Octo</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/octo.png" />
    <link rel="apple-touch-icon" href="/octo.png" />
    <link rel="preload" href="/fonts/mono-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="top">
      <button id="back" class="back" type="button" aria-label="back to the overview" hidden>‹</button>
      <span id="mascot" class="kai mascot" data-mood="idle" aria-hidden="true"><span class="kai-strip"></span></span>
      <div class="who">
        <strong id="host">Octo</strong>
        <span id="where" class="sub"></span>
      </div>
      <button id="menu" class="icon" type="button" aria-label="agent actions" hidden>⋯</button>
      <span id="link" class="dot" data-state="connecting" role="status" aria-label="connecting"></span>
    </header>

    <main id="overview" class="view" hidden>
      <nav id="sessions" class="chips" aria-label="sessions"></nav>
      <section id="stats" class="stats" aria-label="totals"></section>
      <section id="usage" class="usage" aria-label="plan usage"></section>
      <button id="lost" class="lost" type="button" hidden></button>
      <section id="list" class="list" aria-label="agents"></section>
    </main>

    <main id="agent" class="view term-view" hidden>
      <div id="screen" class="screen" aria-label="agent terminal">
        <div id="rows" class="rows"></div>
        <div id="cursor" class="cursor" hidden></div>
      </div>
      <button id="live" class="live" type="button" hidden>↓ live</button>
      <nav id="keys" class="keys" aria-label="keys"></nav>
    </main>

    <main id="pair" class="view pair" hidden>
      <div id="pair-mascot" class="pair-mascot"></div>
      <h1>Octo</h1>
      <p id="pair-text"></p>
      <ol class="steps">
        <li>open <b>Octo</b> on your computer, or the orkai CLI</li>
        <li>press <kbd>ctrl+p</kbd> (or click <b>Pair phone</b>)</li>
        <li>scan the code with this phone's camera, or paste the link shown next to it</li>
      </ol>
      <form id="pair-form" class="sheet-row pair-form" autocomplete="off">
        <input id="pair-link" type="text" inputmode="url" placeholder="paste the link from Octo" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="pairing link" />
        <button class="primary" type="submit">pair</button>
      </form>
      <button id="retry" class="primary" type="button" hidden>try again</button>
    </main>

    <footer id="composer" class="composer" hidden>
      <div id="picks" class="picks"></div>
      <form id="form" class="form" autocomplete="off">
        <textarea id="input" rows="1" enterkeyhint="send" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="message"></textarea>
        <button id="send" class="send" type="submit" aria-label="send">↵</button>
      </form>
    </footer>

    <div id="sheet" class="sheet" hidden>
      <div class="sheet-card" role="dialog" aria-modal="true">
        <header class="sheet-head"><strong id="sheet-title"></strong><button id="sheet-close" class="icon" type="button" aria-label="close">×</button></header>
        <div id="sheet-body" class="sheet-body"></div>
      </div>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>

    <script src="/wire.js"></script>
    <script src="/app.js"></script>
  </body>
</html>

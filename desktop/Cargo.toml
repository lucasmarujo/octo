[package]
name = "orkai-desktop"
version = "0.2.11"
edition = "2024"
rust-version = "1.88"
description = "Octo, by OctoAI: every agent of every project in one window"
license = "MIT"
repository = "https://github.com/lucasmarujo/octo"
publish = false

[[bin]]
name = "octo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clap = { version = "4", features = ["derive"] }
gethostname = "1"
orkai = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"

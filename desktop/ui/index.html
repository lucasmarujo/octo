<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Octo</title>
    <link rel="stylesheet" href="vendor/xterm/xterm.css">
    <link rel="stylesheet" href="styles.css">
    <script src="vendor/xterm/xterm.js"></script>
    <script src="vendor/xterm/addon-fit.js"></script>
    <script src="vendor/xterm/addon-webgl.js"></script>
    <script src="vendor/xterm/addon-web-links.js"></script>
    <script src="vendor/xterm/addon-unicode11.js"></script>
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="titlebar" data-tauri-drag-region>
        <nav id="tabs" class="tabs" data-tauri-drag-region></nav>
        <div class="window-controls">
          <button id="win-min" class="win-button" type="button" aria-label="Minimize" data-i18n-label="Minimize">
            <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg>
          </button>
          <button id="win-max" class="win-button" type="button" aria-label="Maximize" data-i18n-label="Maximize">
            <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="0.5" y="0.5" width="9" height="9" stroke="currentColor" stroke-width="1"/></svg>
          </button>
          <button id="win-close" class="win-button close" type="button" aria-label="Close" data-i18n-label="Close">
            <svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/></svg>
          </button>
        </div>
      </header>
      <div class="body">
        <aside class="sidebar">
          <div class="brand">
            <span id="brand-mascot" class="brand-mascot"></span>
            <div class="brand-text">
              <span class="wordmark">Octo</span>
              <span id="host" class="host"></span>
            </div>
          </div>
          <section class="sessions">
            <span class="caps" data-i18n="Sessions">Sessions</span>
            <div id="sessions" class="session-list"></div>
          </section>
          <div class="spacer"></div>
          <section id="usage" class="usage" hidden></section>
          <footer class="sidebar-footer">
            <button id="pair" class="footer-pair" type="button" title="Pair your phone (ctrl P)" data-i18n-title="Pair your phone (ctrl P)"></button>
            <button id="open-help" class="footer-icon" type="button" aria-label="How to use" title="How to use (F1)" data-i18n-label="How to use" data-i18n-title="How to use (F1)"></button>
            <button id="open-settings" class="footer-icon" type="button" aria-label="Settings" title="Settings" data-i18n-label="Settings" data-i18n-title="Settings"></button>
          </footer>
        </aside>
        <main class="main">
          <section id="overview" class="overview">
            <header class="overview-head">
              <div class="headline">
                <h1 id="session-title" class="session-title"></h1>
                <p id="session-summary" class="session-summary"></p>
              </div>
              <div class="head-actions">
                <button id="recover" class="button warn" type="button" hidden></button>
                <button id="project" class="filter" type="button" aria-haspopup="menu"></button>
                <div id="grid-size" class="segmented" role="group" aria-label="Agents on screen" data-i18n-label="Agents on screen" hidden>
                  <button type="button" data-size="4">4</button>
                  <button type="button" data-size="6">6</button>
                  <button type="button" data-size="8">8</button>
                  <button type="button" data-size="10">10</button>
                  <button type="button" data-size="12">12</button>
                  <button type="button" data-size="all" data-i18n="All">All</button>
                </div>
                <div id="views" class="segmented" role="group" aria-label="View" data-i18n-label="View">
                  <button type="button" data-view="board" data-i18n="Board">Board</button>
                  <button type="button" data-view="list" data-i18n="List">List</button>
                  <button type="button" data-view="grid" data-i18n="Grid">Grid</button>
                </div>
              </div>
            </header>
            <div id="board" class="board"></div>
            <div id="list" class="list" hidden>
              <div class="list-head">
                <span class="cell-index caps">#</span>
                <span class="cell-glyph"></span>
                <span class="cell-name caps" data-i18n="Agent">Agent</span>
                <span class="cell-kind caps" data-i18n="Type">Type</span>
                <span class="cell-state caps" data-i18n="State">State</span>
                <span class="cell-alive caps" data-i18n="Alive">Alive</span>
                <span class="cell-doing caps" data-i18n="Doing">Doing</span>
                <span class="cell-worktree caps" data-i18n="Worktree">Worktree</span>
              </div>
              <div id="list-body" class="list-body"></div>
            </div>
            <div id="grid" class="grid" hidden></div>
            <form id="composer" class="composer" autocomplete="off">
              <div id="palette" class="palette" role="listbox" hidden></div>
              <div class="composer-line">
                <span class="caret"></span>
                <textarea id="task" class="task" rows="1" placeholder="Write a task…" data-i18n-placeholder="Write a task…" spellcheck="false"></textarea>
                <div class="composer-hints">
                  <span><b>/</b> <span data-i18n="commands &amp; skills">commands &amp; skills</span></span>
                  <span><b>!</b> <span data-i18n="run in a terminal">run in a terminal</span></span>
                  <span><b>ctrl ↑</b> <span data-i18n="history">history</span></span>
                </div>
              </div>
              <div class="composer-options">
                <button id="who" class="chip" type="button" aria-haspopup="menu"></button>
                <button id="where" class="chip" type="button"></button>
                <button id="worktree" class="toggle" type="button" aria-pressed="false"></button>
                <button id="bypass" class="toggle" type="button" aria-pressed="false"></button>
                <div class="grow"></div>
                <span class="hint">⇧↵ <span data-i18n="new line">new line</span></span>
                <button id="launch" class="button primary" type="submit"><span data-i18n="Launch">Launch</span> <span class="mono">↵</span></button>
              </div>
            </form>
          </section>
          <section id="agent-view" class="agent-view" hidden>
            <header class="agent-head">
              <div class="agent-heading">
                <div id="agent-title" class="agent-title"></div>
                <div id="agent-meta" class="agent-meta"></div>
              </div>
              <div id="agent-actions" class="agent-actions"></div>
            </header>
            <div class="workspace">
              <div id="terminal" class="term-frame"></div>
              <aside id="details" class="details"></aside>
            </div>
            <footer id="tab-status" class="tab-status"></footer>
          </section>
          <section id="help-view" class="help" hidden></section>
          <section id="settings-view" class="settings-view" hidden></section>
        </main>
      </div>
      <div id="toasts" class="toasts" aria-live="polite"></div>
      <div id="menu" class="menu" role="menu" hidden></div>
      <div id="commit-tip" class="commit-tip" role="tooltip" hidden></div>
      <dialog id="dialog" class="dialog"></dialog>
    </div>
  </body>
</html>

services:
  relay:
    image: node:22-alpine
    container_name: octo-relay

    restart: unless-stopped

    user: "${RELAY_UID:-1000}:${RELAY_GID:-1000}"
    read_only: true
    working_dir: /app
    command: ["node", "server.mjs"]

    environment:
      PORT: "8080"
      RELAY_HOST: octo-relay.marujo.dev
      RELAY_ZONE: octo.marujo.dev
      RELAY_DATA: /data/computers.jsonl

    volumes:
      - ./relay.mjs:/app/relay.mjs:ro
      - ./server.mjs:/app/server.mjs:ro
      - ./data:/data

    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 64

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

    networks:
      - proxy

networks:
  proxy:
    external: true

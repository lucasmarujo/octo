[package]
name = "orkai"
version = "0.2.15"
edition = "2024"
rust-version = "1.88"
description = "Terminal orchestrator for multiple AI coding agents across many projects"
license = "MIT"
repository = "https://github.com/lucasmarujo/octo"
readme = "README.md"
keywords = ["tui", "agents", "claude", "codex", "terminal"]
categories = ["command-line-utilities"]

[workspace]
members = [".", "desktop"]
default-members = ["."]

[lib]
name = "orkai"
path = "src/lib.rs"

[[bin]]
name = "orkai"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
dirs = "6"
gethostname = "1"
getrandom = "0.3"
httparse = "1"
portable-pty = "0.9"
qrcode = { version = "0.14", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
unicode-width = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls"] }
vt100 = "0.16"
which = "8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

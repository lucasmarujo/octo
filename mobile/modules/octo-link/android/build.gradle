plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.marujo.octo.link'
version = '1.0.0'

android {
  namespace "dev.marujo.octo.link"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'com.facebook.react:react-android'
  testImplementation 'junit:junit:4.13.2'
}
